name: Build and publish GHCR image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 发布门禁：镜像构建前先跑单元 + e2e 测试与 mock 自测，避免把未验证代码发布为 :latest
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Coverage gate (unit + e2e + thresholds)
        run: npm run coverage

      - name: Mock protocol selftest
        run: node mock/selftest.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      # actions 供应链固定（INF-10 / INF-21）：所有 uses 固定到 commit SHA，并在行尾保留主版本注释；
      # 升级方式：git ls-remote https://github.com/<org>/<repo> refs/tags/<tag>（annotated tag 取 ^{} 行）
      # 或 GitHub API /repos/<org>/<repo>/git/ref/tags/<tag>，把新 SHA 与注释一起更新。
      # .github/dependabot.yml 的 github-actions 生态每周检查并提 PR（SHA pin 后仍能收到更新）。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clawbridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 发布可审计性（INF-10）：生成 SBOM 与 build provenance attestation，
          # 随多架构镜像写入 GHCR manifest（可用 `docker buildx imagetools inspect` 查看）。
          # 不启用 keyless 签名（需要 id-token 权限），只保留 buildx 默认 attestation 语义。
          provenance: true
          sbom: true
